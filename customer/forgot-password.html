<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Aura Events Luxury Management</title>
  <meta name="description" content="Reset your customer account password securely on Aura Events.">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6.5.2 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Custom Master Styles -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg aura-navbar">
    <div class="container">
      <a class="navbar-brand navbar-brand-aura" href="index.html">
        <div class="brand-icon">
          <i class="fa-solid fa-gem"></i>
        </div>
        <div class="brand-text-container">
          <span class="brand-title">AURA<span class="brand-sparkle">.</span>EVENTS</span>
          <span class="brand-tagline">Luxury Event Planning</span>
        </div>
      </a>
      <a href="login.html" class="btn btn-aura-outline btn-sm">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
      </a>
    </div>
  </nav>

  <!-- Recovery Container -->
  <main class="container my-auto py-5" style="max-width: 540px;">
    <div class="aura-card p-4 p-md-5 shadow-lg bg-white">
      
      <div class="text-center mb-4">
        <div class="toast-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
          <i class="fa-solid fa-key"></i>
        </div>
        <h3 class="fw-bold text-dark">Password Recovery</h3>
        <p class="text-muted small">Enter your registered customer email address and desired new credentials to update your account.</p>
      </div>

      <form id="resetPasswordForm" action="login.html" method="get">
        <!-- Email -->
        <div class="mb-3">
          <label class="form-label" for="resetEmail">Registered Email Address <span class="text-danger">*</span></label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" class="form-control" id="resetEmail" name="email" required value="ahmed.bilal@example.com" placeholder="name@domain.com">
          </div>
        </div>

        <!-- New Password -->
        <div class="mb-3">
          <label class="form-label" for="newResetPassword">New Password <span class="text-danger">*</span></label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" class="form-control" id="newResetPassword" name="newPassword" required placeholder="Minimum 6 characters" value="password123">
          </div>
        </div>

        <!-- Confirm New Password -->
        <div class="mb-4">
          <label class="form-label" for="confirmResetPassword">Confirm New Password <span class="text-danger">*</span></label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" class="form-control" id="confirmResetPassword" name="confirmPassword" required placeholder="Re-enter password" value="password123">
          </div>
        </div>

        <button type="submit" class="btn btn-aura-gold w-100 py-3 mb-3">
          <i class="fa-solid fa-check me-2"></i> Update Password & Return to Login
        </button>
      </form>

      <div class="text-center pt-3 mt-3 border-top">
        <a href="login.html" class="text-muted small text-decoration-none">
          <i class="fa-solid fa-arrow-left me-1"></i> Return to Sign In
        </a>
      </div>
    </div>
  </main>

  <!-- Global Footer -->
  <footer class="aura-footer mt-auto py-4">
    <div class="container text-center text-muted small">
      © 2026 Aura Events Management Platform. All Rights Reserved.
    </div>
  </footer>

</body>
</html>
